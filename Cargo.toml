[package]
name = "edittui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Editor de texto para el terminal, en Rust (Ratatui)"
repository = "https://github.com/AdriLabTech/editTUI"

[dependencies]
ratatui = "0.30.2"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
